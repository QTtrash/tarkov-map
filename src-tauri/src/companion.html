<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raid Signal LAN Companion</title><style>:root{color:#e8e4d8;background:#090b0a;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;padding:18px}header{border-bottom:1px solid #3d423c;padding-bottom:14px}small{color:#8f968d;letter-spacing:.12em}h1{margin:5px 0;font-size:20px}#status{color:#88c69c}main{margin-top:14px}.card{border:1px solid #3d423c;background:#111411;padding:14px;margin-bottom:10px}.map{font-size:12px;color:#9ca398;text-transform:uppercase}.coords{font:600 28px/1.2 ui-monospace,monospace;margin:8px 0}.heading{font:14px ui-monospace,monospace;color:#c9b67f}.empty{color:#8f968d;line-height:1.5}</style></head><body><header><small>RAID SIGNAL</small><h1>Squad companion</h1><div id="status">Pairing…</div></header><main id="players"><p class="empty">Waiting for a position update from the desktop.</p></main><script>
const dec=new TextDecoder(),enc=new TextEncoder(),players=new Map();
const b64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(s.length/4)*4,'=')),c=>c.charCodeAt(0));
const keyText=location.hash.slice(1); location.hash='';
async function run(){if(!keyText){document.querySelector('#status').textContent='Invalid invitation';return}const key=await crypto.subtle.importKey('raw',b64(keyText),'AES-GCM',false,['decrypt']);const ws=new WebSocket(`ws://${location.host}/ws`);ws.onopen=()=>document.querySelector('#status').textContent='Encrypted LAN link active';ws.onclose=()=>document.querySelector('#status').textContent='Disconnected';ws.onmessage=async event=>{try{const envelope=JSON.parse(typeof event.data==='string'?event.data:dec.decode(await event.data.arrayBuffer()));const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(envelope.nonce)},key,b64(envelope.ciphertext));const payload=JSON.parse(dec.decode(plain));players.set(payload.senderId,payload);render()}catch{}}}
function render(){const root=document.querySelector('#players');root.innerHTML=[...players.values()].map(p=>`<article class="card"><div class="map">${safe(p.mapId)} · ${safe(p.nickname||'PLAYER')}</div><div class="coords">${Number(p.x).toFixed(1)} / ${Number(p.z).toFixed(1)}</div><div class="heading">${p.heading==null?'POSITION ONLY':`HEADING ${Number(p.heading).toFixed(0)}°`}</div></article>`).join('')||'<p class="empty">Waiting for a position update from the desktop.</p>'}
function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}run();
</script></body></html>
