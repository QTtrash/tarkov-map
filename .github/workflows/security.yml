name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  secrets:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan complete Git history with Gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source=/repo --no-banner --redact --config=/repo/.gitleaks.toml
          --log-opts=--all
      - uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          extra_args: --only-verified

  rust-audit:
    name: Rust advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install locked cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust lockfile
        # Tauri/Wry currently pins Linux-only glib 0.18.5. The application ships
        # only for Windows; docs/QUALITY.md records the scoped exception and its
        # removal condition. Every other RustSec advisory remains blocking.
        run: >-
          cargo audit --file src-tauri/Cargo.lock
          --ignore RUSTSEC-2024-0429
