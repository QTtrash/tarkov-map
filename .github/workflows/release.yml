name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and Defender scan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            relay/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.93.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: npm install --global npm@11.14.1
      - run: npm ci
      - run: npm --prefix relay ci
      - run: npm run check:all
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - name: Validate tag version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $package = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^\"]+)"' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          if ($tag -ne $package -or $tag -ne $cargo) { throw "Tag, package, and Cargo versions must match" }
      - run: npm run tauri:build
      - name: Stage and scan installer
        id: artifact
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $candidates = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*setup.exe')
          if ($candidates.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($candidates.Count)" }
          $source = $candidates[0]
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $target = "release/Raid-Signal-Setup-$version.exe"
          Copy-Item -LiteralPath $source.FullName -Destination $target
          Update-MpSignature
          Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path $target)
          if (-not (Test-Path -LiteralPath $target)) { throw "Microsoft Defender quarantined the installer" }
          $detected = Get-MpThreatDetection | Where-Object { $_.Resources -match 'Raid-Signal-Setup' }
          if ($detected) { $detected | Format-List | Out-String | Write-Error; throw "Microsoft Defender reported the installer" }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $target).Length
          "$hash  Raid-Signal-Setup-$version.exe" | Set-Content -NoNewline "release/Raid-Signal-Setup-$version.exe.sha256"
          $downloadUrl = "https://github.com/QTtrash/tarkov-map/releases/download/v$version/Raid-Signal-Setup-$version.exe"
          @{ version=$version; filename="Raid-Signal-Setup-$version.exe"; downloadUrl=$downloadUrl; sha256=$hash; size=$size; publishedAt=(Get-Date).ToUniversalTime().ToString('o') } |
            ConvertTo-Json | Set-Content release/release.json
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: release/raid-signal-${{ github.ref_name }}.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: release/
          if-no-files-found: error
          retention-days: 7

  independent-scan:
    name: Independent ClamAV scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: release
      - name: Scan candidate
        run: |
          sudo apt-get update
          sudo apt-get install --yes clamav
          sudo systemctl stop clamav-freshclam.service || true
          sudo freshclam --stdout
          clamscan --infected --no-summary release/*.exe

  publish:
    name: Publish immutable assets
    needs: independent-scan
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/* --verify-tag --generate-notes --notes-file .github/RELEASE_NOTES.md --title "Raid Signal ${{ github.ref_name }}"
