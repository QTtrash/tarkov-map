version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      frontend: { patterns: ["*"] }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /relay
    schedule: { interval: weekly }
    groups:
      relay: { patterns: ["*"] }
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: weekly }
    groups:
      rust: { patterns: ["*"] }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
