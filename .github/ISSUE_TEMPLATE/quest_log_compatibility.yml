name: Quest log compatibility report
description: Share privacy-safe format diagnostics for experimental quest-log import.
title: "compat(quests): "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Raid Signal imports only explicit, attributable quest events. Current Tarkov builds may not retain the format currently recognized.

        **Never attach or paste raw logs.** Logs can contain profile IDs, tokens, account names, IP addresses, Windows usernames, chat, and other private data. Use Raid Signal's **Copy Diagnostics** action; it includes counts only.
  - type: input
    id: raid_signal_version
    attributes:
      label: Raid Signal version
      placeholder: "1.3.1"
    validations:
      required: true
  - type: input
    id: tarkov_version
    attributes:
      label: Tarkov build/version
      description: Use the public game build string only.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Game mode
      options: [Regular PvP, PvE, Seasonal PvP, Unknown]
    validations:
      required: true
  - type: dropdown
    id: transition
    attributes:
      label: Quest action observed
      options: [Accepted/started, Completed/turned in, Failed, Historical scan only]
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Privacy-safe Raid Signal diagnostics
      description: Paste only the output from Copy Diagnostics. It must end with the privacy confirmation line.
      render: text
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the visible event count and whether a relevant action was performed immediately before scanning. Do not paste log lines or paths.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not attach or paste raw Tarkov logs, paths, IDs, tokens, account details, IP addresses, or chat content.
          required: true
        - label: I understand a maintainer may provide separate local sanitization guidance if a structural sample would help.
          required: true
        - label: This report does not require reading game memory, injecting input, modifying game files, or bypassing anti-cheat.
          required: true
