name: Feature proposal
description: Propose a focused, maintainable improvement.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What user problem needs solving? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed behavior }
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives and tradeoffs }
  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: This does not require reading game memory, injecting input, or bypassing anti-cheat.
          required: true
        - label: Any new assets or data sources have documented redistribution terms.
          required: true
